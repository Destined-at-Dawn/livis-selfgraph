[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "livis-selfgraph"
version = "0.1.0"
description = "Dependency-free website adapter for SelfGraph MCP"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [{ name = "Destined-at-Dawn" }]

[tool.setuptools.packages.find]
where = ["src"]
